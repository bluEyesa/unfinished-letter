<!DOCTYPE html>

<html lang="zh-CN">


<head>

<meta charset="UTF-8">

<title>
最终调查报告
</title>


<link rel="stylesheet" href="style.css">


</head>



<body class="report-page">



<div class="report-container">



<h1>
最终调查报告
</h1>



<p class="subtitle">

案件编号：
DG-0912

</p>



<hr>





<div class="intro">


<p>

经过前期资料调查，

警方整理出以下关键问题。

</p>


<p>

请根据已经获得的线索，

填写你的最终判断。

</p>


</div>









<div class="question-box">



<h2>

问题一

</h2>



<p>

顾清河最后是否还活着？

</p>



<input 
id="answer1"
placeholder="请输入答案">



</div>









<div class="question-box">



<h2>

问题二

</h2>



<p>

林初雪最后在哪里？

</p>



<input 
id="answer2"
placeholder="请输入答案">



</div>









<button onclick="submitReport()">

提交调查报告

</button>








<div id="result">

</div>






</div>









<script>


function submitReport(){


let answer1 =
document.getElementById("answer1").value.trim();



let answer2 =
document.getElementById("answer2").value.trim();





if(answer1==="是" && answer2==="冰岛"){


window.location.href="true_end.html";


}


else{


window.location.href="bad_end.html";


}



}



</script>





</body>


</html>
